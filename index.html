<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Elektro-Formelsammlung</title>
<style>
:root{--bg:#f5f5f2;--fg:#1a1a1a;--mu:#6b6b66;--ac:#1f6feb;--sf:#fff;--bd:#dcdcd6;--ok:#0a7a3d;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16171a;--fg:#f0f0ee;--mu:#9a9a95;--ac:#5b9bff;--sf:#222327;--bd:#35363b;--ok:#4ade80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#16171a;--fg:#f0f0ee;--mu:#9a9a95;--ac:#5b9bff;--sf:#222327;--bd:#35363b;--ok:#4ade80;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:14px;max-width:760px;margin-inline:auto}
h1{font-size:22px;margin:4px 0 2px}
.sub{color:var(--mu);font-size:13px;margin:0 0 12px}
#q{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--bd);background:var(--sf);color:var(--fg);font-size:16px;margin-bottom:10px}
#tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px}
#tabs button{flex:none;border:1px solid var(--bd);background:var(--sf);color:var(--fg);border-radius:20px;padding:8px 14px;font-size:14px;cursor:pointer}
#tabs button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.card[hidden]{display:none}
h2{font-size:16px;margin:0 0 4px}
.f{font-family:ui-monospace,Menlo,monospace;font-size:13px;color:var(--mu);margin:0 0 10px;overflow-x:auto;white-space:nowrap}
.note{font-size:14px;line-height:1.5;margin:0}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
label{font-size:12px;color:var(--mu);display:flex;flex-direction:column;gap:3px}
label i{font-style:normal;opacity:.8}
input,select{width:100%;padding:9px 10px;border-radius:9px;border:1px solid var(--bd);background:var(--bg);color:var(--fg);font-size:16px}
.out{margin-top:10px;display:flex;flex-wrap:wrap;gap:8px}
.out div{background:var(--bg);border-radius:10px;padding:8px 12px;display:flex;flex-direction:column;min-width:110px}
.out span{font-size:12px;color:var(--mu)}
.out b{color:var(--ok);font-size:17px}
.out em{color:var(--mu);font-size:13px}
</style>
</head>

{c:"Energie & Sonstiges",n:"Wirkungsgrad",f:"η = Pab / Pzu   Pv = Pzu − Pab",i:[["a","Pab","W"],["z","Pzu","W"]],k:v=>{if(n(v,"a z"))return;return[["η",v.a/v.z*100,"%"],["Verlust Pv",v.z-v.a,"W"]]}},
{c:"Energie & Sonstiges",n:"Batterie / Akku",f:"W = U·C   Laufzeit = W / P",i:[["C","Kapazität","Ah"],["U","Spannung","V",12],["P","Verbraucher","W"]],k:v=>{if(n(v,"C U"))return;const w=v.C*v.U,o=[["Energie",w,"Wh"]];if(!isNaN(v.P))o.push(["Laufzeit",w/v.P,"h"]);return o}},
{c:"Energie & Sonstiges",n:"Beleuchtung (Wirkungsgradverfahren)",f:"N = E·A / (Φ·ηB)",i:[["E","Soll-Beleuchtungsstärke","lx",500],["A","Raumfläche","m²"],["F","Lichtstrom je Leuchte","lm"],["e","Anlagenwirkungsgrad ηB","",0.6]],k:v=>{if(n(v,"E A F e"))return;const N=v.E*v.A/(v.F*v.e);return[["Leuchten",N,"Stk"],["aufgerundet",Math.ceil(N),"Stk"]]}},
{c:"Energie & Sonstiges",n:"Wasser erwärmen",f:"Q = m·1,163 Wh/(kg·K)·ΔT",i:[["m","Menge","l"],["d","Temperaturdifferenz","K"],["P","Heizleistung (optional)","kW"]],k:v=>{if(n(v,"m d"))return;const q=v.m*1.163*v.d/1000,o=[["Energie",q,"kWh"]];if(!isNaN(v.P))o.push(["Zeit",q/v.P,"h"]);return o}}
];
const list=document.getElementById("list"),tabs=document.getElementById("tabs"),q=document.getElementById("q");
let cat="Alle";
function card(f){const d=document.createElement("section");d.className="card";d.dataset.c=f.c;d.dataset.n=(f.n+" "+f.f).toLowerCase();
let h=`<h2>${f.n}</h2><p class="f">${f.f}</p>`;
if(f.t)h+=`<p class="note">${f.t}</p>`;
else h+='<div class="g">'+f.i.map(([id,l,u,df,o])=>`<label>${l}${u?` <i>[${u}]</i>`:""}`+(o?`<select data-id="${id}">${o.map(([a,b])=>`<option value="${b}"${b==df?" selected":""}>${a}</option>`).join("")}</select>`:`<input data-id="${id}" inputmode="decimal" value="${df??""}">`)+"</label>").join("")+'</div><div class="out"></div>';
d.innerHTML=h;
if(!f.t){const out=d.querySelector(".out"),run=()=>{const v={};d.querySelectorAll("[data-id]").forEach(e=>{v[e.dataset.id]=e.value.trim()===""?NaN:parseFloat(e.value.replace(",","."))});let r;try{r=f.k(v)}catch(e){}out.innerHTML=r?r.map(([l,x,u])=>`<div><span>${l}</span><b>${typeof x==="string"?x:fmt(x)} ${u}</b></div>`).join(""):"<em>Werte eintragen</em>"};d.addEventListener("input",run);run()}
return d}
const cards=F.map(card);cards.forEach(c=>list.appendChild(c));
function filter(){const s=q.value.toLowerCase().trim();cards.forEach(d=>d.hidden=!((cat==="Alle"||d.dataset.c===cat)&&d.dataset.n.includes(s)))}
["Alle",...new Set(F.map(f=>f.c))].forEach(c=>{const b=document.createElement("button");b.textContent=c;if(c===cat)b.className="on";b.onclick=()=>{cat=c;tabs.querySelectorAll("button").forEach(x=>x.className=x===b?"on":"");filter()};tabs.appendChild(b)});
q.addEventListener("input",filter);
</script>
